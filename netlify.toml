# Root Netlify configuration for SSIS Intelligent Attendance Platform
[build]
  base = "frontend"
  publish = "dist"
  command = "npm run build"

[build.environment]
  VITE_API_BASE_URL = "https://ssis-intelligent-attendance-platform.onrender.com"

[[redirects]]
  from = "/*"
  to = "/index.html"
  status = 200
