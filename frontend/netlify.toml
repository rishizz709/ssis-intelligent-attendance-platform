# Netlify build configuration for SSIS Frontend
[build]
  publish = "dist"
  command = "npm run build"

[build.environment]
  VITE_API_BASE_URL = "https://ssis-intelligent-attendance-platform.onrender.com"

# SPA routing: Redirect all requests to index.html for client-side routing
[[redirects]]
  from = "/*"
  to = "/index.html"
  status = 200
