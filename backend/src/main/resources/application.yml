server:
  port: ${PORT:8080}
  forward-headers-strategy: framework
  servlet:
    context-path: /

app:
  openapi:
    production-url: ${OPENAPI_PRODUCTION_URL:${RENDER_EXTERNAL_URL:https://ssis-intelligent-attendance-platform.onrender.com}}
    local-url: http://localhost:8080

spring:
  application:
    name: ssis-academic-platform

  datasource:
    url: jdbc:h2:mem:ssisdb;DB_CLOSE_DELAY=-1;DB_CLOSE_ON_EXIT=FALSE
    driverClassName: org.h2.Driver
    username: sa
    password:

  h2:
    console:
      enabled: true
      path: /h2-console
      settings:
        web-allow-others: true

  jpa:
    database-platform: org.hibernate.dialect.H2Dialect
    hibernate:
      ddl-auto: none
    show-sql: false
    properties:
      hibernate:
        format_sql: true

  sql:
    init:
      mode: always
      schema-locations: classpath:schema.sql
      data-locations: classpath:data.sql

# Swagger OpenAPI Documentation Configuration
springdoc:
  api-docs:
    path: /api-docs
  swagger-ui:
    path: /swagger-ui.html
    operationsSorter: method

# Logging configuration
logging:
  level:
    root: INFO
    com.aditya.ssis: DEBUG
    org.springframework.web: INFO
    org.hibernate.SQL: WARN